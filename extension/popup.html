<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 13px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c7d2fe;
    }
    .box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .label { color: #94a3b8; }
    .val { font-weight: 600; }
    .btn {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn:hover { background: #4338ca; }
    .badge-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 2px 6px; border-radius: 4px; }
    .badge-err { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 6px; border-radius: 4px; }
    a { color: #818cf8; text-decoration: none; font-size: 11px; }
  </style>
</head>
<body>
  <h2>🎓 Godot AI Mahasiswa</h2>
  <div class="box">
    <div class="row">
      <span class="label">Local Daemon:</span>
      <span id="daemon-badge" class="badge-err">Checking...</span>
    </div>
    <div class="row">
      <span class="label">Repository:</span>
      <a href="https://github.com/NourAnisa/godot_AI" target="_blank" class="val">godot_AI</a>
    </div>
    <div class="row">
      <span class="label">Target Proyek:</span>
      <span style="font-size: 11px; color: #cbd5e1;">godot_AI/godot_project</span>
    </div>
  </div>

  <button id="btn-pull" class="btn" style="background: #10b981;">⬇️ Pull Kode dari AI</button>
  <button id="btn-push" class="btn">⬆️ Push Tugas ke GitHub</button>
  <button id="btn-refresh" class="btn" style="background: #334155;">🔄 Refresh Status</button>

  <p style="font-size: 11px; color: #64748b; margin-top: 12px; text-align: center;">
    Kompatibel dengan ChatGPT, Claude, DeepSeek & Gemini
  </p>

  <script src="popup.js"></script>
</body>
</html>
